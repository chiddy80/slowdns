[package]
name = "slowdns-installer"
version = "1.0.0"
edition = "2021"
authors = ["RASHID KAMOE <rashidkamote95@gmail.com>"]
description = "Modern SlowDNS Installation Script"
repository = "https://github.com/chiddy80/slowdns"
license = "MIT"
readme = "README.md"

[dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
indicatif = "0.17"
colored = "2.0"
crossterm = "0.27"
console = "0.15"
dialoguer = "0.11"
serde_json = "1.0"
chrono = "0.4"
nix = "0.27"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
